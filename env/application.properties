# =====================================================================
#  Cấu hình TEST LOCAL cho backend Bookstore (dùng với docker-compose)
#  - MySQL, Redis, Mailpit chạy trong Docker
#  - Các dịch vụ bên ngoài (Cloudinary, Gemini, VNPay, ZaloPay, MoMo,
#    GHN, Qdrant, Google OAuth) dùng giá trị GIẢ -> các chức năng đó
#    nằm NGOÀI phạm vi test (xem docs/test-plan.md)
# =====================================================================
server.port=8080
frontend.url=http://localhost:3000

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://mysql:3306/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=bookstore
spring.datasource.password=bookstore123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- Redis (OTP, cache) ----------
spring.data.redis.host=redis
spring.data.redis.port=6379

# ---------- Mail -> Mailpit (xem email tại http://localhost:8025) ----------
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ---------- JWT (HS512 cần khóa >= 64 ký tự) ----------
jwt.signerKey=local-test-signer-key-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.valid-duration=3600
jwt.refreshable-duration=36000

# ---------- Google OAuth (giả) ----------
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/auth/google/callback
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ---------- Cloudinary (giả) ----------
cloudinary.cloud-name=dummy
cloudinary.api-key=dummy
cloudinary.api-secret=dummy

# ---------- AI / Vector DB (giả) ----------
# Backend ban moi dung Spring AI (OpenAI) cho chatbot -> bat buoc co api-key, dung khoa gia
spring.ai.openai.api-key=dummy-openai-key
spring.ai.openai.base-url=http://localhost:9
gemini.api.key=dummy
qdrant.url=http://localhost:6333
qdrant.api.key=dummy

# ---------- VNPay sandbox (giả) ----------
