name: QA Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # chạy tay từ tab Actions

jobs:
  test:
    name: API + E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Kiểm tra code test
      - name: Install test dependencies
        run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # 2. Dựng hệ thống được test
      - name: Start backend + MySQL + Redis + Mailpit (Docker)
        working-directory: env
        run: docker compose up -d --build

      - name: Start frontend (Next.js)
        working-directory: sut/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
        run: |
          npm ci --legacy-peer-deps
          nohup npm run dev > ../../frontend.log 2>&1 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 180000

      # 3. Chạy test (global-setup tự chờ backend sẵn sàng)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run all tests
        run: npx playwright test

      # 4. Báo cáo
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Service logs (khi lỗi)
        if: failure()
        run: |
          docker compose -f env/docker-compose.yml logs backend --tail=200
          tail -n 100 frontend.log
